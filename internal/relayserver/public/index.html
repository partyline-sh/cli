<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <meta name="theme-color" content="#1b1a19" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Partyline remote</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/layout.css" />
  <body data-view="machines">
    <main id="app"></main>

    <section id="pairing" class="screen" data-step="scan">
      <div class="step" data-for="scan">
        <h1>Pair with your computer</h1>
        <p class="note">
          In partyline on your computer, press <kbd>ctrl-\</kbd> <kbd>p</kbd>,
          then scan the code with your phone's camera.
        </p>
        <button type="button" class="primary" id="scan">Or scan it here</button>
        <video hidden playsinline muted></video>
        <button type="button" class="link" id="photo-show">
          Take a photo of the code instead
        </button>
        <input
          type="file"
          id="photo"
          accept="image/*"
          capture="environment"
          hidden
        />
        <button type="button" class="link" id="paste-show">
          Can't scan? Paste the code instead
        </button>
        <div id="paste" hidden>
          <label for="offer">Pairing code</label>
          <textarea
            id="offer"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          ></textarea>
          <button type="button" class="primary" id="paste-use">
            Use this code
          </button>
        </div>
      </div>
      <div class="step" data-for="wait">
        <h1>Your pairing code</h1>
        <p class="paircode" id="paircode" aria-label="Pairing code"></p>
      </div>
      <div class="step" data-for="done">
        <h1>Paired</h1>
      </div>
      <p id="status" role="status"></p>
      <button type="button" class="primary" id="pair-done">Done</button>
      <button type="button" class="link" id="pair-cancel">Cancel</button>
    </section>

    <script type="module" src="/pairing.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
