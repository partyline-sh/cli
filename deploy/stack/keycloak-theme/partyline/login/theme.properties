# The partyline sign-in theme.
#
# parent=keycloak, and the ONLY override is a stylesheet. No FreeMarker template is copied.
#
# That is deliberate and it is the whole maintenance argument: a theme that forks login.ftl
# inherits every future Keycloak change by hand — new fields, new flows, new security patches to
# the markup — and silently rots at the next upgrade. A stylesheet layered on top of the stock
# markup keeps working, because Keycloak's class names (kc-form, login-pf-page, pf-c-button) are
# far more stable than its templates.
parent=keycloak
import=common/keycloak

styles=css/login.css css/partyline.css
